<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡代辦清單 | My To-Do App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示套件 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google 字體 Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-800 flex flex-col items-center p-4 sm:p-8">

  <!-- 主要容器 -->
  <main class="w-full max-w-xl glass-card rounded-3xl shadow-2xl border border-white/20 p-6 sm:p-8 my-auto">
    
    <!-- 標頭 -->
    <header class="mb-8 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
          My Tasks
        </h1>
        <p class="text-sm text-slate-500 mt-1" id="date-display">載入日期中...</p>
      </div>
      <div class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-full text-xs font-semibold tracking-wide">
        <span id="completed-count">0</span> / <span id="total-count">0</span> 完成
      </div>
    </header>

    <!-- 輸入框區塊 -->
    <form id="todo-form" class="flex gap-2 mb-6">
      <div class="relative flex-1">
        <input 
          type="text" 
          id="todo-input"
          placeholder="今天想完成什麼任務？" 
          class="w-full px-4 py-3.5 pl-11 rounded-xl bg-slate-100/80 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm"
          required
        >
        <i class="fa-solid fa-plus absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
      </div>
      <button 
        type="submit" 
        class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-500/20 active:scale-95 text-sm flex items-center gap-2 whitespace-nowrap"
      >
        <span>新增</span>
      </button>
    </form>

    <!-- 待辦清單列表 -->
    <ul id="todo-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
      <!-- 預設載入狀態 -->
      <div class="text-center py-10 text-slate-400">
        <i class="fa-solid fa-spinner animate-spin text-2xl mb-2"></i>
        <p class="text-sm">連線至 Firebase 中...</p>
      </div>
    </ul>

  </main>

  <!-- 頁尾 -->
  <footer class="mt-6 text-xs text-slate-400 font-light">
    Hosted on <span class="text-slate-300 font-medium">Vercel</span> • Powered by <span class="text-slate-300 font-medium">Firebase</span>
  </footer>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc, 
      serverTimestamp,
      query,
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ✅ 已代入你的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyA0gCb7A7YPareF8esh8ct-rj955CjCPZM",
      authDomain: "my-test-db-b9117.firebaseapp.com",
      projectId: "my-test-db-b9117",
      storageBucket: "my-test-db-b9117.firebasestorage.app",
      messagingSenderId: "279887826419",
      appId: "1:279887826419:web:0b9fdbc1883533ace81686",
      measurementId: "G-EGC3BZZD3P"
    };

    // 初始化 Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const todosRef = collection(db, "todos");

    // DOM 元素
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const completedCountEl = document.getElementById('completed-count');
    const totalCountEl = document.getElementById('total-count');

    // 顯示今日日期
    const options = { weekday: 'long', month: 'short', day: 'numeric' };
    document.getElementById('date-display').textContent = new Date().toLocaleDateString('zh-TW', options);

    // 新增代辦事項
    todoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      try {
        await addDoc(todosRef, {
          text: text,
          completed: false,
          createdAt: serverTimestamp()
        });
        todoInput.value = '';
      } catch (err) {
        console.error("新增失敗：", err);
      }
    });

    // 實時監聽 Firestore 資料變更 (Realtime Sync)
    const q = query(todosRef, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      todoList.innerHTML = '';
      let completedCount = 0;
      const totalCount = snapshot.docs.length;

      if (totalCount === 0) {
        todoList.innerHTML = `
          <div class="text-center py-10 text-slate-400">
            <i class="fa-regular fa-clipboard text-3xl mb-2 stroke-1"></i>
            <p class="text-sm">目前沒有任何任務，新增一個吧！</p>
          </div>`;
      }

      snapshot.docs.forEach((docSnapshot) => {
        const todo = docSnapshot.data();
        const id = docSnapshot.id;

        if (todo.completed) completedCount++;

        const li = document.createElement('li');
        li.className = `group flex items-center justify-between p-4 rounded-2xl bg-white/60 hover:bg-white border border-slate-100 shadow-sm transition-all duration-200 ${todo.completed ? 'opacity-60' : ''}`;
        
        li.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0 pr-2">
            <button class="toggle-btn w-6 h-6 rounded-full border-2 ${todo.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-indigo-500'} flex items-center justify-center transition-colors shrink-0">
              <i class="fa-solid fa-check text-xs ${todo.completed ? 'block' : 'hidden'}"></i>
            </button>
            <span class="text-sm text-slate-700 truncate ${todo.completed ? 'line-through text-slate-400' : 'font-medium'}">
              ${escapeHtml(todo.text)}
            </span>
          </div>
          <button class="delete-btn opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 p-2 transition-all">
            <i class="fa-regular fa-trash-can"></i>
          </button>
        `;

        // 切換完成狀態
        li.querySelector('.toggle-btn').addEventListener('click', async () => {
          await updateDoc(doc(db, "todos", id), {
            completed: !todo.completed
          });
        });

        // 刪除項目
        li.querySelector('.delete-btn').addEventListener('click', async () => {
          await deleteDoc(doc(db, "todos", id));
        });

        todoList.appendChild(li);
      }, (error) => {
        console.error("Firestore 監聽失敗：", error);
        todoList.innerHTML = `<p class="text-center text-rose-500 text-sm">無法讀取資料，請確認 Firestore 權限規則設定。</p>`;
      });

      // 更新統計數字
      completedCountEl.textContent = completedCount;
      totalCountEl.textContent = totalCount;
    });

    // 防範 XSS 攻擊轉義字元
    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
    }
  </script>
</body>
</html>
