<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示套件 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google 字體 Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50/50 via-slate-50 to-purple-50/40 min-h-screen text-slate-700 p-5 sm:p-8 flex items-start justify-center">

  <!-- 主容器 -->
  <div class="w-full max-w-5xl flex flex-col gap-6">

    <!-- ==================== 頂部導覽 ==================== -->
    <nav class="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200/80 p-1.5 flex gap-1">
      <button data-maintab="vocab" class="main-tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-bold rounded-xl transition-colors bg-indigo-600 text-white">
        <i class="fa-solid fa-book-open"></i> <span class="hidden sm:inline">單字 &amp; 分析</span><span class="sm:hidden">單字</span>
      </button>
      <button data-maintab="tasks" class="main-tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-bold rounded-xl transition-colors text-slate-500 hover:bg-slate-100">
        <i class="fa-solid fa-check-square"></i> Tasks
      </button>
      <button data-maintab="memo" class="main-tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-bold rounded-xl transition-colors text-slate-500 hover:bg-slate-100">
        <i class="fa-solid fa-note-sticky"></i> Memo
      </button>
    </nav>

    <!-- ==================== 分頁：單字 & 分析 ==================== -->
    <div id="main-panel-vocab" class="main-panel flex flex-col gap-6">

    <!-- ==================== 上方：VOCAB 區塊 ==================== -->
    <main class="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-indigo-100/80 p-6 sm:p-7 transition-all">
      <!-- 標頭區塊：僅留 Vocab，右側放總計 -->
      <header class="mb-5 flex justify-between items-center">
        <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight flex items-center gap-2.5">
          <i class="fa-solid fa-book-open text-indigo-500 text-2xl"></i> Vocab
        </h1>
        <div class="bg-indigo-50 text-indigo-700 px-3.5 py-1 rounded-full text-xs font-semibold border border-indigo-100">
          總計 <span id="vocab-total-count" class="font-bold text-indigo-900 text-sm">0</span> 字
        </div>
      </header>

      <!-- 新增單字表單 -->
      <form id="vocab-form" class="relative z-10 grid grid-cols-1 sm:grid-cols-12 gap-2.5 mb-5 bg-indigo-50/30 p-4 rounded-xl border border-indigo-100/60">
        <div class="sm:col-span-4 flex gap-2">
          <input 
            type="text" 
            id="vocab-word" 
            placeholder="單字 (例: Refactor)" 
            class="flex-1 px-3.5 py-2.5 rounded-lg bg-white border border-slate-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800 transition-all placeholder:text-slate-400"
            required
          >
          <select id="vocab-pos" class="relative z-20 px-2.5 py-2.5 rounded-lg bg-white border border-slate-200 text-sm font-bold text-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer">
            <option value="v.">v.</option>
            <option value="n.">n.</option>
            <option value="adj.">adj.</option>
            <option value="adv.">adv.</option>
            <option value="phr.">phr.</option>
          </select>
        </div>
        <input 
          type="text" 
          id="vocab-meaning" 
          placeholder="中文解釋" 
          class="sm:col-span-3 px-3.5 py-2.5 rounded-lg bg-white border border-slate-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800 transition-all placeholder:text-slate-400"
          required
        >
        <input 
          type="text" 
          id="vocab-example" 
          placeholder="例句 (選填)" 
          class="sm:col-span-3 px-3.5 py-2.5 rounded-lg bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800 transition-all placeholder:text-slate-400"
        >
        <button type="submit" class="sm:col-span-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2.5 rounded-lg transition-all font-semibold active:scale-95 shadow-sm shadow-indigo-200">
          儲存
        </button>
        <p id="vocab-status" class="sm:col-span-12 text-xs font-medium hidden"></p>
      </form>

      <!-- 搜尋 + 類型篩選 -->
      <div class="flex flex-col sm:flex-row gap-2.5 mb-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input
            id="vocab-search"
            type="text"
            placeholder="搜尋單字、解釋或例句..."
            class="w-full pl-8 pr-8 py-2 rounded-lg bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800 placeholder:text-slate-400"
          >
          <button id="vocab-search-clear" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs" title="清除">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="type-filter" class="flex gap-1 bg-slate-100 rounded-lg p-1 text-xs shrink-0">
          <button data-type="ALL" class="type-btn px-3 py-1.5 rounded-md font-semibold transition-all bg-white text-indigo-600 shadow-sm">全部</button>
          <button data-type="WORD" class="type-btn px-3 py-1.5 rounded-md font-semibold transition-all text-slate-500 hover:text-slate-700">單字</button>
          <button data-type="PHRASE" class="type-btn px-3 py-1.5 rounded-md font-semibold transition-all text-slate-500 hover:text-slate-700">片語</button>
        </div>
      </div>

      <!-- A-Z 字母索引篩選條 (ALL 獨立一行，A-Z 一排) -->
      <div id="alpha-filter" class="flex flex-col gap-1.5 mb-5 text-xs">
        <!-- JS 動態生成 -->
      </div>

      <!-- 單字列表展示區 (3 欄，限制最大高度與滾動) -->
      <ul id="vocab-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5 max-h-[520px] overflow-y-auto pr-1">
        <div class="col-span-full text-center py-8 text-indigo-400">
          <i class="fa-solid fa-spinner animate-spin text-xl mb-2"></i>
          <p class="text-xs font-medium">連線至 Firebase 中...</p>
        </div>
      </ul>

      <!-- 底部分頁 -->
      <div class="mt-6 pt-4 border-t border-slate-100 flex justify-center items-center text-xs text-slate-500">
        <div id="pagination-controls" class="flex flex-wrap items-center justify-center gap-1.5">
          <!-- JS 動態生成分頁按鈕 -->
        </div>
      </div>
    </main>


    <!-- ==================== 中間：文章分析 ==================== -->
    <section class="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-purple-100/80 p-6 sm:p-7 transition-all">
      <div class="flex flex-wrap items-center gap-x-2.5 gap-y-1 mb-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-purple-500"></i> 文章分析
        </h2>
        <span class="text-xs text-slate-400 font-normal">貼上英文文章，取得翻譯與核心單字片語</span>
      </div>

      <textarea
        id="article-input"
        rows="5"
        placeholder="在這裡貼上一篇英文文章（最多 10000 字）..."
        class="w-full px-3.5 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 text-slate-800 placeholder:text-slate-400 resize-y leading-relaxed"
      ></textarea>

      <div class="flex items-center gap-3 mt-3">
        <button
          id="analyze-btn"
          class="bg-purple-600 hover:bg-purple-700 text-white text-sm px-5 py-2.5 rounded-lg font-semibold transition-all active:scale-95 shadow-sm shadow-purple-200 disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
        >
          <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i>分析
        </button>
        <span id="analyze-status" class="text-xs text-slate-500"></span>
      </div>

      <div id="analyze-result" class="hidden mt-5 space-y-5">
        <!-- 全文翻譯 -->
        <div>
          <button id="toggle-translation" class="flex items-center gap-2 text-sm font-bold text-slate-700 mb-2">
            <i class="fa-solid fa-language text-purple-500"></i> 全文翻譯
            <i id="translation-chevron" class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform"></i>
          </button>
          <div id="translation-body" class="text-sm text-slate-600 leading-relaxed bg-slate-50/70 border border-slate-200/60 rounded-xl p-4 whitespace-pre-wrap"></div>
        </div>

        <!-- 核心單字與片語 -->
        <div>
          <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
            <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-purple-500"></i> 核心單字與片語
              <span class="text-xs font-normal text-slate-400">點 + 加入單字庫</span>
            </h3>
          </div>
          <ul id="analyze-vocab-list" class="grid grid-cols-1 md:grid-cols-2 gap-2.5 max-h-[380px] overflow-y-auto pr-1"></ul>
        </div>
      </div>
    </section>

    </div><!-- /main-panel-vocab -->


    <!-- ==================== 分頁：Tasks ==================== -->
    <div id="main-panel-tasks" class="main-panel hidden">
      <section class="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4">
          <i class="fa-solid fa-check-square text-indigo-500"></i> Tasks
        </h2>

        <div class="flex items-center justify-between mb-4">
          <p class="text-xs text-slate-400 font-normal" id="date-display">載入日期中...</p>
          <div class="bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full text-xs font-semibold border border-indigo-100">
            <span id="completed-count">0</span> / <span id="total-count">0</span>
          </div>
        </div>

        <!-- 新增 Task 表單 -->
        <form id="todo-form" class="flex gap-2 mb-4">
          <input
            type="text"
            id="todo-input"
            placeholder="新增任務..."
            class="flex-1 px-3.5 py-2 rounded-lg bg-slate-50 border border-slate-200 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800 placeholder:text-slate-400"
            required
          >
          <input
            type="date"
            id="todo-date"
            class="px-2.5 py-2 rounded-lg bg-slate-50 border border-slate-200 text-slate-600 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer"
            required
          >
          <button
            type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3.5 py-2 rounded-lg transition-all font-semibold whitespace-nowrap active:scale-95 shadow-sm shadow-indigo-200"
          >
            新增
          </button>
        </form>

        <!-- 清單 -->
        <ul id="todo-list" class="space-y-2 max-h-[420px] overflow-y-auto pr-1">
          <div class="text-center py-4 text-slate-400 text-xs">載入中...</div>
        </ul>
      </section>
    </div><!-- /main-panel-tasks -->


    <!-- ==================== 分頁：Memo ==================== -->
    <div id="main-panel-memo" class="main-panel hidden">
      <section class="bg-white/90 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4">
          <i class="fa-solid fa-note-sticky text-amber-500"></i> Memo
        </h2>

        <!-- 新增 Memo 表單 -->
        <form id="research-form" class="flex gap-2 mb-4">
          <input
            type="text"
            id="research-input"
            placeholder="快速記下想法、技術或關鍵字..."
            class="flex-1 px-3.5 py-2 rounded-lg bg-slate-50 border border-slate-200 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 text-slate-800 placeholder:text-slate-400"
            required
          >
          <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-3.5 py-2 rounded-lg transition-all font-semibold whitespace-nowrap active:scale-95 shadow-sm shadow-amber-200">
            記錄
          </button>
        </form>

        <!-- 備忘標籤列表 -->
        <ul id="research-list" class="flex flex-wrap gap-2 max-h-[420px] overflow-y-auto pr-1">
          <div class="text-center w-full py-4 text-slate-400 text-xs">尚無紀錄...</div>
        </ul>
      </section>
    </div><!-- /main-panel-memo -->

    <footer class="pt-1 text-[11px] text-slate-400 text-right font-light">
      Hosted on Vercel • Powered by Firebase
    </footer>

  </div>

  <!-- ==================== 編輯單字 Modal ==================== -->
  <div id="vocab-edit-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-regular fa-pen-to-square text-indigo-500"></i> 編輯單字
        </h3>
        <button id="vocab-edit-close" class="text-slate-400 hover:text-slate-600 text-lg leading-none" title="關閉">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="vocab-edit-form" class="space-y-3">
        <div class="flex gap-2">
          <input id="edit-word" type="text" required placeholder="單字"
            class="flex-1 px-3.5 py-2.5 rounded-lg bg-white border border-slate-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800">
          <select id="edit-pos" class="px-2.5 py-2.5 rounded-lg bg-white border border-slate-200 text-sm font-bold text-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer">
            <option value="v.">v.</option>
            <option value="n.">n.</option>
            <option value="adj.">adj.</option>
            <option value="adv.">adv.</option>
            <option value="phr.">phr.</option>
          </select>
        </div>
        <input id="edit-meaning" type="text" required placeholder="中文解釋"
          class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-200 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800">
        <textarea id="edit-example" rows="3" placeholder="例句 (選填)"
          class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-800 resize-y leading-relaxed"></textarea>
        <p id="vocab-edit-status" class="text-xs text-rose-600 font-medium hidden"></p>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" id="vocab-edit-cancel" class="px-4 py-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-sm font-semibold transition-all">
            取消
          </button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-all active:scale-95 shadow-sm shadow-indigo-200">
            儲存變更
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== 確認刪除 Modal ==================== -->
  <div id="confirm-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-sm p-6">
      <div class="flex items-start gap-3 mb-5">
        <div class="w-9 h-9 rounded-full bg-rose-100 text-rose-500 flex items-center justify-center shrink-0">
          <i class="fa-regular fa-trash-can text-sm"></i>
        </div>
        <div class="min-w-0">
          <h3 class="text-base font-bold text-slate-800">確認刪除</h3>
          <p id="confirm-message" class="text-sm text-slate-500 mt-0.5 break-words">確定要刪除嗎？</p>
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button type="button" id="confirm-cancel" class="px-4 py-2 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-sm font-semibold transition-all">
          取消
        </button>
        <button type="button" id="confirm-ok" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold transition-all active:scale-95 shadow-sm shadow-rose-200">
          刪除
        </button>
      </div>
    </div>
  </div>


  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc, 
      serverTimestamp,
      query,
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ✅ Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyA0gCb7A7YPareF8esh8ct-rj955CjCPZM",
      authDomain: "my-test-db-b9117.firebaseapp.com",
      projectId: "my-test-db-b9117",
      storageBucket: "my-test-db-b9117.firebasestorage.app",
      messagingSenderId: "279887826419",
      appId: "1:279887826419:web:0b9fdbc1883533ace81686",
      measurementId: "G-EGC3BZZD3P"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const todosRef = collection(db, "todos");
    const vocabRef = collection(db, "vocabularies");
    const researchRef = collection(db, "research");

    // 顯示今日日期
    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    document.getElementById('date-display').textContent = new Date().toLocaleDateString('zh-TW', options);


    // ==================== 主分頁切換 (單字&分析 / Tasks / Memo) ====================
    document.querySelectorAll('.main-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.maintab;
        document.querySelectorAll('.main-tab-btn').forEach(b => {
          const active = b === btn;
          b.classList.toggle('bg-indigo-600', active);
          b.classList.toggle('text-white', active);
          b.classList.toggle('text-slate-500', !active);
          b.classList.toggle('hover:bg-slate-100', !active);
        });
        document.querySelectorAll('.main-panel').forEach(p => {
          p.classList.toggle('hidden', p.id !== `main-panel-${target}`);
        });
      });
    });


    // ==================== 共用：確認刪除視窗 ====================
    const confirmModal = document.getElementById('confirm-modal');
    const confirmMessage = document.getElementById('confirm-message');
    let confirmResolver = null;

    function askConfirm(message) {
      confirmMessage.textContent = message || '確定要刪除嗎？此動作無法復原。';
      confirmModal.classList.remove('hidden');
      return new Promise((resolve) => { confirmResolver = resolve; });
    }

    function settleConfirm(result) {
      confirmModal.classList.add('hidden');
      if (confirmResolver) { confirmResolver(result); confirmResolver = null; }
    }

    document.getElementById('confirm-ok').addEventListener('click', () => settleConfirm(true));
    document.getElementById('confirm-cancel').addEventListener('click', () => settleConfirm(false));
    confirmModal.addEventListener('click', (e) => {
      if (e.target === confirmModal) settleConfirm(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !confirmModal.classList.contains('hidden')) settleConfirm(false);
    });


    // ==================== 1. Vocab 邏輯 ====================
    const vocabForm = document.getElementById('vocab-form');
    const vocabList = document.getElementById('vocab-list');
    const vocabTotalCount = document.getElementById('vocab-total-count');
    const alphaFilterContainer = document.getElementById('alpha-filter');
    const paginationControls = document.getElementById('pagination-controls');
    const vocabStatus = document.getElementById('vocab-status');
    const vocabSearchInput = document.getElementById('vocab-search');
    const vocabSearchClear = document.getElementById('vocab-search-clear');
    const typeFilterContainer = document.getElementById('type-filter');

    let allVocabularies = [];
    let selectedLetter = 'ALL';
    let selectedType = 'ALL';
    let searchTerm = '';
    let currentPage = 1;
    // ✅ 修改單頁顯示數量為 15 個
    const ITEMS_PER_PAGE = 15;

    // 發音
    window.speakText = function(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的瀏覽器不支援語音發音。");
      }
    };

    // 生成 A-Z 標籤（ALL 獨立一行，A-Z 排成一列並可自動換行）
    function initAlphaFilter() {
      const azLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      const btnClass = (active) =>
        `alpha-btn px-2.5 py-1 rounded-lg border transition-all ${active
          ? 'bg-indigo-600 text-white border-indigo-600 font-bold'
          : 'bg-white text-slate-600 border-slate-200 hover:bg-indigo-50 hover:text-indigo-600'}`;

      alphaFilterContainer.innerHTML = `
        <div>
          <button data-letter="ALL" class="${btnClass(true)}">ALL</button>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${azLetters.map(l => `<button data-letter="${l}" class="${btnClass(false)}">${l}</button>`).join('')}
        </div>
      `;

      alphaFilterContainer.querySelectorAll('.alpha-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          selectedLetter = e.target.dataset.letter;
          currentPage = 1;
          
          alphaFilterContainer.querySelectorAll('.alpha-btn').forEach(b => {
            b.className = "alpha-btn px-2.5 py-1 rounded-lg border transition-all bg-white text-slate-600 border-slate-200 hover:bg-indigo-50 hover:text-indigo-600";
          });
          e.target.className = "alpha-btn px-2.5 py-1 rounded-lg border transition-all bg-indigo-600 text-white border-indigo-600 font-bold";
          
          renderVocabularies();
        });
      });
    }

    initAlphaFilter();

    // 搜尋
    vocabSearchInput.addEventListener('input', () => {
      searchTerm = vocabSearchInput.value.trim().toLowerCase();
      vocabSearchClear.classList.toggle('hidden', searchTerm === '');
      currentPage = 1;
      renderVocabularies();
    });
    vocabSearchClear.addEventListener('click', () => {
      vocabSearchInput.value = '';
      searchTerm = '';
      vocabSearchClear.classList.add('hidden');
      currentPage = 1;
      renderVocabularies();
      vocabSearchInput.focus();
    });

    // 類型篩選（全部 / 單字 / 片語）
    typeFilterContainer.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedType = btn.dataset.type;
        currentPage = 1;
        typeFilterContainer.querySelectorAll('.type-btn').forEach(b => {
          const active = b === btn;
          b.classList.toggle('bg-white', active);
          b.classList.toggle('text-indigo-600', active);
          b.classList.toggle('shadow-sm', active);
          b.classList.toggle('text-slate-500', !active);
        });
        renderVocabularies();
      });
    });

    vocabForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const word = document.getElementById('vocab-word').value.trim();
      const pos = document.getElementById('vocab-pos').value;
      const meaning = document.getElementById('vocab-meaning').value.trim();
      const example = document.getElementById('vocab-example').value.trim();

      if (!word || !meaning) return;

      // ✅ 儲存前去重複（不分大小寫）
      const duplicate = allVocabularies.find(
        v => (v.word || '').trim().toLowerCase() === word.toLowerCase()
      );
      if (duplicate) {
        showVocabStatus(`「${word}」已經在單字庫裡了。`, 'error');
        return;
      }

      try {
        await addDoc(vocabRef, {
          word,
          pos,
          meaning,
          example,
          createdAt: serverTimestamp()
        });
        vocabForm.reset();
        showVocabStatus(`已新增「${word}」`, 'success');
      } catch (err) {
        console.error("新增失敗：", err);
        showVocabStatus('新增失敗，請稍後再試。', 'error');
      }
    });

    let vocabStatusTimer;
    function showVocabStatus(message, type) {
      clearTimeout(vocabStatusTimer);
      vocabStatus.textContent = message;
      vocabStatus.classList.remove('hidden', 'text-rose-600', 'text-emerald-600');
      vocabStatus.classList.add(type === 'error' ? 'text-rose-600' : 'text-emerald-600');
      vocabStatusTimer = setTimeout(() => vocabStatus.classList.add('hidden'), 3000);
    }

    onSnapshot(query(vocabRef, orderBy("createdAt", "desc")), (snapshot) => {
      allVocabularies = snapshot.docs.map(docSnapshot => ({
        id: docSnapshot.id,
        ...docSnapshot.data()
      }));
      vocabTotalCount.textContent = allVocabularies.length;
      renderVocabularies();
    });

    function renderVocabularies() {
      let filtered = allVocabularies;

      if (selectedType === 'PHRASE') {
        filtered = filtered.filter(item => item.pos === 'phr.');
      } else if (selectedType === 'WORD') {
        filtered = filtered.filter(item => item.pos !== 'phr.');
      }

      if (selectedLetter !== 'ALL') {
        filtered = filtered.filter(item =>
          item.word && item.word.trim().toUpperCase().startsWith(selectedLetter)
        );
      }

      if (searchTerm) {
        filtered = filtered.filter(item =>
          (item.word || '').toLowerCase().includes(searchTerm) ||
          (item.meaning || '').toLowerCase().includes(searchTerm) ||
          (item.example || '').toLowerCase().includes(searchTerm)
        );
      }

      const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedItems = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      renderPagination(totalPages);

      vocabList.innerHTML = '';
      if (paginatedItems.length === 0) {
        vocabList.innerHTML = `<p class="col-span-full text-center text-slate-400 text-xs py-8">目前無資料。</p>`;
        return;
      }

      paginatedItems.forEach((item) => {
        const li = document.createElement('li');
        li.className = "group bg-slate-50/80 hover:bg-white p-4 rounded-xl border border-indigo-100/80 hover:border-indigo-300 shadow-2xs hover:shadow-sm flex flex-col justify-between transition-all relative";

        li.innerHTML = `
          <div>
            <div class="flex items-baseline gap-2 flex-wrap pr-16">
              <span class="font-extrabold text-indigo-600 text-base sm:text-lg tracking-wide break-words">${escapeHtml(item.word)}</span>
              <span class="text-xs font-bold text-purple-700 bg-purple-100/80 px-2 py-0.5 rounded-md">${escapeHtml(item.pos)}</span>
              <button onclick="speakText('${escapeHtml(item.word)}')" class="text-indigo-400 hover:text-indigo-600 text-sm ml-1 transition-colors" title="發音">
                <i class="fa-solid fa-volume-high"></i>
              </button>
            </div>
            <p class="text-sm text-slate-800 font-bold mt-1.5 break-words">${escapeHtml(item.meaning)}</p>
          </div>
          <div class="absolute top-2 right-2 flex gap-0.5 opacity-0 group-hover:opacity-100 transition-all">
            <button class="edit-vocab text-slate-300 hover:text-indigo-500 hover:bg-indigo-50 rounded-md p-1.5 leading-none text-xs" title="編輯">
              <i class="fa-regular fa-pen-to-square"></i>
            </button>
            <button class="delete-vocab text-slate-300 hover:text-rose-500 hover:bg-rose-50 rounded-md p-1.5 leading-none text-xs" title="刪除">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
          ${item.example ? `<p class="text-xs text-slate-500 italic border-l-2 border-indigo-400/60 pl-2 mt-2 whitespace-pre-wrap break-words font-normal">"${escapeHtml(item.example)}"</p>` : ''}
        `;

        li.querySelector('.edit-vocab').addEventListener('click', () => openVocabEdit(item));
        li.querySelector('.delete-vocab').addEventListener('click', async () => {
          if (await askConfirm(`確定要刪除單字「${item.word}」嗎？`)) {
            deleteDoc(doc(db, "vocabularies", item.id));
          }
        });
        vocabList.appendChild(li);
      });
    }

    // 產生帶省略號的頁碼清單，例如 [1, '...', 4, 5, 6, '...', 20]
    function buildPageList(current, total) {
      if (total <= 7) {
        return Array.from({ length: total }, (_, i) => i + 1);
      }
      const pages = [1];
      const start = Math.max(2, current - 1);
      const end = Math.min(total - 1, current + 1);
      if (start > 2) pages.push('...');
      for (let i = start; i <= end; i++) pages.push(i);
      if (end < total - 1) pages.push('...');
      pages.push(total);
      return pages;
    }

    function goToPage(page, total) {
      const target = Math.min(Math.max(1, page), total);
      if (target === currentPage) return;
      currentPage = target;
      renderVocabularies();
    }

    function renderPagination(totalPages) {
      paginationControls.innerHTML = '';
      if (totalPages <= 1) return;

      const navBtn = (label, page, disabled) => {
        const btn = document.createElement('button');
        btn.className = "px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-indigo-50 text-slate-700 disabled:opacity-30 disabled:cursor-not-allowed transition-all font-medium";
        btn.innerHTML = label;
        btn.disabled = disabled;
        if (!disabled) btn.addEventListener('click', () => goToPage(page, totalPages));
        return btn;
      };

      paginationControls.appendChild(navBtn('<i class="fa-solid fa-chevron-left"></i>', currentPage - 1, currentPage === 1));

      buildPageList(currentPage, totalPages).forEach(p => {
        if (p === '...') {
          const span = document.createElement('span');
          span.className = "px-1.5 text-slate-400";
          span.textContent = '…';
          paginationControls.appendChild(span);
          return;
        }
        const btn = document.createElement('button');
        const active = p === currentPage;
        btn.className = active
          ? "min-w-[32px] px-2.5 py-1.5 rounded-lg border border-indigo-600 bg-indigo-600 text-white font-bold transition-all"
          : "min-w-[32px] px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 transition-all font-medium";
        btn.textContent = p;
        if (!active) btn.addEventListener('click', () => goToPage(p, totalPages));
        paginationControls.appendChild(btn);
      });

      paginationControls.appendChild(navBtn('<i class="fa-solid fa-chevron-right"></i>', currentPage + 1, currentPage === totalPages));
    }


    // ==================== 1b. 編輯單字 ====================
    const vocabEditModal = document.getElementById('vocab-edit-modal');
    const vocabEditForm = document.getElementById('vocab-edit-form');
    const editWord = document.getElementById('edit-word');
    const editPos = document.getElementById('edit-pos');
    const editMeaning = document.getElementById('edit-meaning');
    const editExample = document.getElementById('edit-example');
    const vocabEditStatus = document.getElementById('vocab-edit-status');
    let editingId = null;

    function openVocabEdit(item) {
      editingId = item.id;
      editWord.value = item.word || '';
      editPos.value = item.pos || 'n.';
      editMeaning.value = item.meaning || '';
      editExample.value = item.example || '';
      vocabEditStatus.classList.add('hidden');
      vocabEditModal.classList.remove('hidden');
      editWord.focus();
    }

    function closeVocabEdit() {
      vocabEditModal.classList.add('hidden');
      editingId = null;
    }

    document.getElementById('vocab-edit-close').addEventListener('click', closeVocabEdit);
    document.getElementById('vocab-edit-cancel').addEventListener('click', closeVocabEdit);
    vocabEditModal.addEventListener('click', (e) => {
      if (e.target === vocabEditModal) closeVocabEdit();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !vocabEditModal.classList.contains('hidden')) closeVocabEdit();
    });

    vocabEditForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!editingId) return;
      const word = editWord.value.trim();
      const meaning = editMeaning.value.trim();
      if (!word || !meaning) return;

      // 改名時避免與其他單字重複
      const dup = allVocabularies.find(v =>
        v.id !== editingId && (v.word || '').trim().toLowerCase() === word.toLowerCase()
      );
      if (dup) {
        vocabEditStatus.textContent = `「${word}」已經在單字庫裡了。`;
        vocabEditStatus.classList.remove('hidden');
        return;
      }

      try {
        await updateDoc(doc(db, "vocabularies", editingId), {
          word,
          pos: editPos.value,
          meaning,
          example: editExample.value.trim()
        });
        closeVocabEdit();
      } catch (err) {
        console.error('更新失敗：', err);
        vocabEditStatus.textContent = '更新失敗，請稍後再試。';
        vocabEditStatus.classList.remove('hidden');
      }
    });


    // ==================== 2. Tasks 邏輯 ====================
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoDateInput = document.getElementById('todo-date');
    const todoList = document.getElementById('todo-list');
    const completedCountEl = document.getElementById('completed-count');
    const totalCountEl = document.getElementById('total-count');

    const todayStr = new Date().toISOString().split('T')[0];
    todoDateInput.value = todayStr;

    todoForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      const dueDate = todoDateInput.value;
      if (!text || !dueDate) return;

      try {
        await addDoc(todosRef, {
          text: text,
          dueDate: dueDate,
          completed: false,
          createdAt: serverTimestamp()
        });
        todoInput.value = '';
        todoDateInput.value = todayStr;
      } catch (err) {
        console.error("新增失敗：", err);
      }
    });

    function getDueDateBadge(dueDateStr, isCompleted) {
      if (!dueDateStr) return '';
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const targetDate = new Date(dueDateStr + 'T00:00:00');
      const diffDays = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));

      let badgeClass = "text-slate-500 bg-slate-100";
      let labelText = dueDateStr;

      if (diffDays === 0) {
        labelText = "今天";
        badgeClass = "text-indigo-700 bg-indigo-100 font-semibold";
      } else if (diffDays === 1) {
        labelText = "明天";
        badgeClass = "text-sky-700 bg-sky-100 font-medium";
      } else if (diffDays < 0 && !isCompleted) {
        labelText = `已逾期`;
        badgeClass = "text-rose-600 bg-rose-100 font-bold";
      }

      return `<span class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded ${badgeClass}">
        ${labelText}
      </span>`;
    }

    onSnapshot(query(todosRef, orderBy("createdAt", "desc")), (snapshot) => {
      todoList.innerHTML = '';
      let completedCount = 0;
      const totalCount = snapshot.docs.length;

      if (totalCount === 0) {
        todoList.innerHTML = `<div class="text-center py-4 text-slate-400 text-xs"><p>無待辦事項</p></div>`;
      }

      snapshot.docs.forEach((docSnapshot) => {
        const todo = docSnapshot.data();
        const id = docSnapshot.id;
        if (todo.completed) completedCount++;

        const li = document.createElement('li');
        li.className = `group flex items-center justify-between p-2.5 rounded-lg bg-slate-50/80 hover:bg-slate-100/60 border border-slate-200/60 transition-all ${todo.completed ? 'opacity-50' : ''}`;
        
        li.innerHTML = `
          <div class="flex items-center gap-2.5 flex-1 min-w-0 pr-2">
            <button class="toggle-btn w-4 h-4 rounded border ${todo.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 hover:border-indigo-500'} flex items-center justify-center shrink-0 transition-colors">
              <i class="fa-solid fa-check text-[8px] ${todo.completed ? 'block' : 'hidden'}"></i>
            </button>
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-xs text-slate-800 font-medium truncate ${todo.completed ? 'line-through text-slate-400' : ''}">
                ${escapeHtml(todo.text)}
              </span>
              ${getDueDateBadge(todo.dueDate, todo.completed)}
            </div>
          </div>
          <button class="delete-btn opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 transition-all">
            <i class="fa-regular fa-trash-can text-xs"></i>
          </button>
        `;

        li.querySelector('.toggle-btn').addEventListener('click', () => updateDoc(doc(db, "todos", id), { completed: !todo.completed }));
        li.querySelector('.delete-btn').addEventListener('click', async () => {
          if (await askConfirm(`確定要刪除任務「${todo.text}」嗎？`)) {
            deleteDoc(doc(db, "todos", id));
          }
        });
        todoList.appendChild(li);
      });

      completedCountEl.textContent = completedCount;
      totalCountEl.textContent = totalCount;
    });


    // ==================== 3. Memo 邏輯 ====================
    const researchForm = document.getElementById('research-form');
    const researchInput = document.getElementById('research-input');
    const researchList = document.getElementById('research-list');

    researchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const topic = researchInput.value.trim();
      if (!topic) return;

      try {
        await addDoc(researchRef, {
          topic,
          createdAt: serverTimestamp()
        });
        researchInput.value = '';
      } catch (err) {
        console.error("新增失敗：", err);
      }
    });

    onSnapshot(query(researchRef, orderBy("createdAt", "desc")), (snapshot) => {
      researchList.innerHTML = '';
      if (snapshot.docs.length === 0) {
        researchList.innerHTML = `<p class="text-center text-slate-400 text-xs w-full py-2">記錄幾筆筆記吧...</p>`;
      }

      snapshot.docs.forEach((docSnapshot) => {
        const item = docSnapshot.data();
        const id = docSnapshot.id;

        const li = document.createElement('li');
        li.className = "group inline-flex items-center gap-1.5 bg-amber-50 hover:bg-amber-100/80 text-amber-900 border border-amber-200/70 px-2.5 py-1 rounded-md text-xs font-semibold transition-all";

        li.innerHTML = `
          <span>${escapeHtml(item.topic)}</span>
          <button class="delete-research opacity-0 group-hover:opacity-100 text-amber-500 hover:text-rose-500 transition-all">
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        `;

        li.querySelector('.delete-research').addEventListener('click', async () => {
          if (await askConfirm(`確定要刪除「${item.topic}」嗎？`)) {
            deleteDoc(doc(db, "research", id));
          }
        });
        researchList.appendChild(li);
      });
    });

    function escapeHtml(text) {
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
    }


    // ==================== 4. 文章分析 邏輯 ====================
    const articleInput = document.getElementById('article-input');
    const analyzeBtn = document.getElementById('analyze-btn');
    const analyzeStatus = document.getElementById('analyze-status');
    const analyzeResult = document.getElementById('analyze-result');
    const translationBody = document.getElementById('translation-body');
    const translationChevron = document.getElementById('translation-chevron');
    const toggleTranslationBtn = document.getElementById('toggle-translation');
    const analyzeVocabList = document.getElementById('analyze-vocab-list');

    let analyzedItems = [];

    toggleTranslationBtn.addEventListener('click', () => {
      const hidden = translationBody.classList.toggle('hidden');
      translationChevron.style.transform = hidden ? 'rotate(-90deg)' : '';
    });

    articleInput.addEventListener('input', () => {
      if (articleInput.value.trim() === '') {
        resetAnalysis();
      }
    });

    function resetAnalysis() {
      analyzeResult.classList.add('hidden');
      translationBody.textContent = '';
      translationBody.classList.remove('hidden');
      translationChevron.style.transform = '';
      analyzeVocabList.innerHTML = '';
      analyzedItems = [];
      analyzeStatus.textContent = '';
    }

    analyzeBtn.addEventListener('click', async () => {
      const text = articleInput.value.trim();
      if (text.length < 20) {
        analyzeStatus.textContent = '請貼上較完整的文章。';
        return;
      }
      analyzeBtn.disabled = true;
      analyzeStatus.textContent = '分析中，約需 10~20 秒...';
      try {
        const resp = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || `伺服器錯誤 (${resp.status})`);
        renderAnalysis(data);
        analyzeStatus.textContent = '';
      } catch (err) {
        console.error('分析失敗：', err);
        analyzeStatus.textContent = '分析失敗：' + err.message;
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    function renderAnalysis(data) {
      translationBody.textContent = data.translation || '（無翻譯結果）';
      translationBody.classList.remove('hidden');
      translationChevron.style.transform = '';

      analyzedItems = [
        ...(data.vocab || []),
        ...(data.phrases || [])
      ];

      const existing = new Set(allVocabularies.map(v => (v.word || '').trim().toLowerCase()));
      analyzeVocabList.innerHTML = '';

      if (analyzedItems.length === 0) {
        analyzeVocabList.innerHTML = `<li class="text-xs text-slate-400 py-3">沒有擷取到單字。</li>`;
      }

      analyzedItems.forEach((item) => {
        const isDup = existing.has(item.word.trim().toLowerCase());
        const li = document.createElement('li');
        li.className = "flex items-start gap-2.5 bg-slate-50/80 border border-slate-200/60 rounded-xl p-3";
        li.innerHTML = `
          <div class="min-w-0 flex-1">
            <div class="flex items-baseline gap-2 flex-wrap">
              <span class="font-extrabold text-indigo-600 text-sm">${escapeHtml(item.word)}</span>
              <span class="text-[11px] font-bold text-purple-700 bg-purple-100/80 px-1.5 py-0.5 rounded">${escapeHtml(item.pos)}</span>
              <button type="button" class="speak-analyze text-indigo-400 hover:text-indigo-600 text-xs" title="發音">
                <i class="fa-solid fa-volume-high"></i>
              </button>
              ${isDup ? '<span class="text-[10px] text-amber-600 font-semibold">已在單字庫</span>' : ''}
            </div>
            <p class="text-xs text-slate-700 font-semibold mt-1">${escapeHtml(item.meaning)}</p>
            ${item.example ? `<p class="text-[11px] text-slate-500 italic mt-0.5">"${escapeHtml(item.example)}"</p>` : ''}
          </div>
          <button
            type="button"
            class="add-analyze-item shrink-0 w-7 h-7 rounded-lg border flex items-center justify-center transition-all ${isDup ? 'text-slate-300 border-slate-200 cursor-not-allowed' : 'text-indigo-500 border-indigo-200 hover:bg-indigo-600 hover:text-white hover:border-indigo-600'}"
            title="${isDup ? '已在單字庫' : '加入單字庫'}"
            ${isDup ? 'disabled' : ''}
          >
            <i class="fa-solid fa-plus text-xs"></i>
          </button>
        `;
        li.querySelector('.speak-analyze').addEventListener('click', () => speakText(item.word));

        const addBtn = li.querySelector('.add-analyze-item');
        if (!isDup) {
          addBtn.addEventListener('click', async () => {
            addBtn.disabled = true;
            try {
              await addDoc(vocabRef, {
                word: item.word,
                pos: item.pos,
                meaning: item.meaning,
                example: item.example || '',
                createdAt: serverTimestamp()
              });
              existing.add(item.word.trim().toLowerCase());
              addBtn.innerHTML = '<i class="fa-solid fa-check text-xs"></i>';
              addBtn.title = '已加入';
              addBtn.className = "add-analyze-item shrink-0 w-7 h-7 rounded-lg border flex items-center justify-center text-emerald-500 border-emerald-200";
            } catch (err) {
              console.error('加入失敗：', err);
              analyzeStatus.textContent = '加入失敗：' + err.message;
              addBtn.disabled = false;
            }
          });
        }

        analyzeVocabList.appendChild(li);
      });

      analyzeResult.classList.remove('hidden');
    }
  </script>
</body>
</html>
